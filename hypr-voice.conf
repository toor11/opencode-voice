# OpenCode voice binds (DOCUMENTATION ONLY - real binds live in ~/.config/hypr/hyprland.lua,
# because Hyprland v0.55+ uses the Lua config and ignores hyprland.conf sources).
#
# HOLD SUPER+space, RELEASE to type transcript at cursor (dictation mode,
# via OC_VOICE_MODE=type + wtype - works in terminal, browser, documents)
# HOLD SUPER+SHIFT+space, RELEASE to send to opencode + hear reply (ask mode)
#
# HANDS-FREE alternative (single press, pause to submit, no release needed):
#   hl.bind(mainMod .. " + ALT + space",
#     hl.dsp.exec_cmd("OC_VOICE_MODE=type /path/to/opencode-voice/voice-auto.sh"))
# End-of-speech is streamer-side VAD trailing silence (1.2s default);
# audio flows mic -> Unix socket -> daemon either way, no WAV files involved.
#
# Release order matters (push-to-talk): let go of SPACE first, then the
# modifiers. Releasing SUPER (or SHIFT) before SPACE produces a bare
# space-release event that matches no bind, so voice-stop.sh never runs and
# the streamer keeps capturing. Damage is bounded (streamers auto-finalize at
# 45s), and the next press reaps the orphan.
