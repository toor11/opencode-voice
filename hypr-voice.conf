# OpenCode voice binds (DOCUMENTATION ONLY - real binds live in ~/.config/hypr/hyprland.lua,
# because Hyprland v0.55+ uses the Lua config and ignores hyprland.conf sources).
#
# HOLD SUPER+space, RELEASE to send to opencode + hear reply (ask mode)
# HOLD SUPER+SHIFT+space, RELEASE to type transcript at cursor (dictation mode,
# via OC_VOICE_MODE=type + wtype - works in terminal, browser, documents)
