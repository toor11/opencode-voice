# OpenCode voice binds (DOCUMENTATION ONLY - real binds live in ~/.config/hypr/hyprland.lua,
# because Hyprland v0.55+ uses the Lua config and ignores hyprland.conf sources).
#
# HOLD SUPER+space, RELEASE to type transcript at cursor (dictation mode,
# via OC_VOICE_MODE=type + wtype - works in terminal, browser, documents)
# HOLD SUPER+SHIFT+space, RELEASE to send to opencode + hear reply (ask mode)
#
# Release order matters: let go of SPACE first, then the modifiers.
# Releasing SUPER (or SHIFT) before SPACE produces a bare space-release
# event that matches no bind, so voice-stop.sh never runs and pw-record
# keeps capturing silently. Damage is bounded (captures auto-stop at 60s,
# oversized files are discarded), but that utterance is lost.
